name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: npm install
        run: npm ci

      - name: Engine tests
        working-directory: engine
        run: go test ./...

      - name: CLI tests (incl. 1.0 parity corpus)
        run: go test ./...

      - name: App Go tests
        working-directory: app
        run: go test ./internal/...

      - name: svelte-check
        run: npm run check

      - name: Frontend tests
        run: npm test

      - name: Build app
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1
          ./scripts/build.ps1 -SkipTests -Version "ci-${{ github.sha }}"
